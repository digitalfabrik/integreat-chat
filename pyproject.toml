[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "integreat_chat"
description = "Machine Learning Back End for the Integreat Chat functionality"
version = "2026.2.0"
authors = [{name = "Tür an Tür Digitalfabrik gGmbH", email = "tech@tuerantuer.org"}]
readme = "README.md"
requires-python = ">=3.13"
keywords = [
  "Integreat"
]
license = {text = "Apache 2.0 License"}
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

dependencies = [
  "accelerate",
  "aiohttp",
  "beautifulsoup4",
  "celery",
  "django",
  "django-celery",
  "docling",
  "gunicorn",
  "langchain-text-splitters",
  "lxml",
  "numpy",
  "pillow",
  "pypdf",
  "rapidocr",
  "redis",
  "torch",
  "uvicorn",
]


[project.optional-dependencies]
dev = [
  "black",
  "isort",
  "pytest",
  "pytest-django",
  "ruff",
]

[project.urls]
"Homepage" = "https://tuerantuer.de/digitalfabrik"
"Source Code" = "https://github.com/digitalfabrik/integreat-chat"
"Issues" = "https://github.com/digitalfabrik/integreat-chat/issues"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "integreat_chat.core.settings"
python_files = ["tests.py"]

[tool.setuptools]
script-files = ["integreat_chat/manage.py"]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["integreat_chat*"]

# Ship non-Python data files (templates, static assets, etc.) that
# live inside the app directories. ``packages.find`` above only pulls
# in directories with an ``__init__.py`` — templates/static would be
# silently dropped, which is exactly what produced the
# ``TemplateDoesNotExist: bescheidcheck/bescheidcheck.html`` error
# in production.
[tool.setuptools.package-data]
"integreat_chat.bescheidcheck" = [
  "templates/**/*.html",
  "templates/**/*.css",
  "templates/**/*.js",
  "static/*",
  "static/**/*",
]
"integreat_chat.search" = [
  "templates/**/*.html",
  "templates/**/*.css",
  "templates/**/*.js",
  "static/*",
  "static/**/*",
]
# Also ensure data files under non-app directories are not dropped,
# in case an existing deployment relies on a top-level static/ dir.
"integreat_chat" = [
  "static/**/*",
]
